# Declared arrays and custom overrides for full parity tests under set -euo pipefail
declare -a NORMAL_AGENTS=(claude-haiku codex-1)
declare -a WORKER_AGENTS=(openrouter-minimax deepinfra-qwen)

declare -A AGENT_TYPE=([claude-haiku]=claude [codex-1]=codex)
declare -A AGENT_MODEL=([claude-haiku]=haiku [codex-1]=gpt-6.1-sol)
declare -A AGENT_EXTRA_ARGS=([claude-haiku]="--verbose --debug")

CLAUDE_BIN="/custom/bin/claude"
AGENT_HANG_MIN=15
RUN_PATH="/custom/path/bin:/usr/bin:/bin"
