# agents.toml — the configuration of the agent harness. docs/configuration.md describes every setting.
# Copy it to $AGENTS_HOME/agents.toml and edit. Secrets (tokens, API keys) go to secrets.toml, mode 0600, never here.

# The language of what only you read: questions and notifications. Commits, pull requests, reviews and code stay
# in English.
language = "English"

# --- Agents ----------------------------------------------------------------------------------------------------
# One table per agent. The name is lowercase letters, digits and '-'; an agent runs one task at a time, so add
# more entries (claude-2, ...) for more parallel work.
#   cli   claude | codex | gemini (Antigravity, the `agy` command) | opencode (any API provider)
#   model optional; without it the CLI runs its default model
#   args  optional extra arguments for the CLI, an array: every element is one argument, nothing is split
#   max_context  optional bound in tokens of this agent's session: above it the next run starts a new session; without it the [session] bound applies, 0 switches it off
#   context      optional window in tokens of the model, for an opencode agent of openrouter or deepinfra and for a codex
#                agent: the CLI compacts the session at it (below max_context is allowed, that is what compacts early);
#                without it the CLI gets no window, 0 is refused
#   output       optional most tokens the model writes in one answer, at most context: opencode is told it next to the window.
#                With context alone opencode uses its fallback output limit instead of the model catalogue's, so set both.

[agents.claude-1]
cli = "claude"
model = "sonnet"

[agents.codex-1]
cli = "codex"
args = ["-c", "model_reasoning_effort=\"medium\""]

[agents.gemini-1]
cli = "gemini"

# A worker, a cheap model for simple tasks (opencode takes "provider/model"); list it under `workers` below:
# [agents.deepinfra-glm]
# cli = "opencode"
# model = "deepinfra/zai-org/GLM-5.3-Flash"
# capabilities = ["build:rust", "hw:rp2350"] # matched against delegate request `requires`
# context = 202752   # the model's window in tokens: the CLI compacts the session at it
# output = 32768     # its output limit in tokens; with context alone opencode uses its fallback instead of the catalogue's

# --- Investigators (advanced, expensive models) -------------------------------------------------------------------
# They review every pull request, and lead the teams they are in. Every pull request gets two reviews from
# investigators outside the team, so keep at least two, more than the investigators you put in one team.

[investigators.inv-opus]
cli = "claude"
model = "opus"

[investigators.inv-codex]
cli = "codex"
args = ["-c", "model_reasoning_effort=\"high\""]

# --- Accounts (optional) ------------------------------------------------------------------------------------------
# An account is one subscription or key. A run of an agent with an account gets the account's variables in its
# environment (later wins: the daemon's, [agent_env], the account's env, the account's secrets); the quota is not shared
# between the agents of an account yet. Agents without an account run as before. Check the provider's
# terms before you use more than one subscription.
# An agent or an investigator with an account is named `<owner>-...`. The secret variables of the account are
# `[account_env.NAME]` in secrets.toml; a variable is set in `env` or there, never in both.
# [accounts.comp-claude]
# owner = "comp"                                  # a lowercase word of letters and digits
# [accounts.comp-claude.env]
# CLAUDE_CONFIG_DIR = "/home/you/.claude-comp"    # not a secret; Codex: CODEX_HOME
#
# [investigators.comp-inv-opus]
# cli = "claude"
# model = "opus"
# account = "comp-claude"

# --- Which agents are normal, which are workers -----------------------------------------------------------------
# Every agent is in exactly one of the two lists. `normal`: takes task-list items, solo or in a team, and may
# coordinate a team. `workers`: never coordinate and take no items; they serve `delegate` requests, the first free
# worker in the order of this list, so put the stronger ones first.

[tiers]
normal = ["claude-1", "codex-1", "gemini-1"]
workers = []

# Cargo builds launched by agents and gates avoid large per-worktree incremental caches.
# Set true to opt back in; manual builds outside the harness keep Cargo's own policy.
[build]
incremental = false

# --- Programs ------------------------------------------------------------------------------------------------------
# A bare name is looked up on `agent_path`, the PATH the agents see (toolchains: cargo, go, ...); an absolute path
# is used as it is. The directory of the daemon executable is automatically prepended first to PATH without duplicates.
# Paths start at the root: there is no `~`. Every setting here has a default.

[binaries]
claude = "/home/you/.local/bin/claude"
codex = "/home/you/.local/bin/codex"
agy = "/home/you/.local/bin/agy"
opencode = "/home/you/.local/bin/opencode"
agentbus = "/home/you/.local/bin/agentbus"
# Serena (https://github.com/oraios/serena) finds code through language servers; without this line it is not used.
# serena = "serena"
agent_path = ["/home/you/.local/bin", "/home/you/.cargo/bin", "/home/you/go/bin", "/usr/local/bin", "/usr/bin", "/bin"]

# --- The reminder of Serena ----------------------------------------------------------------------------------------
# A run that has Serena and made `remind_after` searches of code without it — the shell running grep, rg, sed -n, cat,
# head, tail or find over a file or a directory of code, or the CLI's own Grep, Glob or Read over one — is told once in
# its session to find code with Serena; the message names the count. 0 turns the reminder off. A file without `[serena]`
# keeps the default.
[serena]
# remind_after = 40

# --- Hang watchdog and limits ---------------------------------------------------------------------------------------
# A run with no activity for `hang_minutes` is killed and resumed from its session; after `hang_strikes` hangs in a
# row without progress the task is marked hung. A team whose every task sleeps for `asleep_minutes` while an item of it
# is unfinished waits for nobody: its lead is woken and told so, and after two such wake-ups you are told.

[watchdog]
hang_minutes = 30
hang_strikes = 3
asleep_minutes = 5

# An exhausted quota pauses the task until the reset time the CLI gives; `quota_pause_minutes` is the pause when it
# gives none. A rate limit (HTTP 429) is a short pause. `tail_lines`: how many of a run's last lines of error output
# are read to recognise these limits. `wake_ups_per_message`: a message to a sleeping agent starts a run of it; when
# that many runs end without the agent reading the message, it is not woken for it again (the message stays unread
# until the agent's next run reads it) and a warning is logged; 0 never wakes an agent for a message.

[investigations]
# Whole minutes from the current investigator task creation, excluding queue time; 10..=1440.
answer_minutes = 30

[limits]
# Remove teams after this many minutes without a run or new commit; 0 disables removal.
# Count from the later of last activity and current daemon startup; downtime never counts.
# Queued work, free-investigator waits, human pause/stop, provider resets and external merges protect teams.
idle_team_minutes = 120
# Reserved for automatic replacement in the next part; this release only removes teams.
idle_team_restarts = 1
# Per-run turn budget for CLIs that support one (currently Claude Code); must be positive.
max_turns = 300
# Consecutive turn-limit continuations in the same session; 0 disables automatic continuation.
turn_limit_resumes = 3
quota_pause_minutes = 30
rate_limit_pause_minutes = 5
tail_lines = 30
wake_ups_per_message = 2
# An agent has one run at a time over all its teams and solo tasks: a task queued for it waits until its run in the
# other team ends. 0 lets an agent run as many tasks at once as are queued (the behaviour before this key).
runs_per_agent = 1
# The same for the agents of [tiers] workers, whose runs are cheap: 0 is no limit.
runs_per_worker = 1
# Minutes an agent may work on an item without its pull request in review: then its run is stopped and the task is
# handed over through [replacement] (another agent, the lead, or it fails and you are told). 0, the default when the key
# is absent, turns it off.
round_minutes = 120

# Reviews: "changes requested" goes back to the team at most `fix_passes` times; then you are asked. The checks
# before a review (see the repository's `checks` below) send a round back at most `check_passes` times. A reviewer whose
# task failed or was stopped is replaced by another free investigator at once, and one that is paused (a quota, a rate
# limit) after `replace_after_minutes`; one its provider refused again after `[replacement] limit_retries` is replaced at
# once by an investigator of another provider; when no investigator is free you are told.

[review]
# Stored permission for the later second-opinion activation; requests are still refused in this release.
allow_second_opinion_on_blocker = true
min_first_full_reviews = 2
fix_passes = 5
check_passes = 2
replace_after_minutes = 15

# Plans: every task keeps its plan of steps in `.agent/plan.md` in its worktree (docs/plan.md). The daemon reads it at
# the end of every run and keeps each new version in the history. A run of a role here that ends `STATUS: DONE` against
# its plan goes back to the same agent with the reason (no plan, a plan with a line that does not parse, a step still to
# do or in hand, a step the version before had) at most `bounces` times for the task; then you are asked once, in the
# task's questions file. `0` never sends a run back; the plan is recorded all the same.

[plan]
roles = ["solo", "member", "coordinator"]
bounces = 3
check_seconds = 120
check_refuse = ["agent gate", "make gate"]

# Worker requests: what the harness does with the result of a worker (a model of `[tiers] workers`) that served a
# delegate request. A request is given to one worker first; when its result is wrong (the request's check fails, the
# worker ends otherwise than DONE, it says it cannot, it changed a file outside the request's files, or its run passed
# `seconds`) the request goes once more to a free worker of another CLI (of the same CLI when no other is free), and a
# second wrong result returns the step to the requester. A request that names no path to write asks for facts only: its result goes to the requester as before,
# its check is run all the same.
#   tries     how many tries a request gets, its first try included; 1 never gives it to a second worker; a request gets one
#             second try at most, so a value above 2 behaves as 2 (default: 2)
#   seconds   how long a worker's run may last; a run past it is a wrong result; 0 has no limit (default: 0)
#   wait_seconds  how long a request waits in the queue for a free worker; after it the request is returned to its
#             requester, who does the step itself; 0 waits for ever (default: 600)
# New local requests count declared FAILED or QUESTIONS endings as wrong results, even without file changes.
# Existing open requests without ownership keep their previous immediate-failure handling for non-DONE endings.

[workers]
tries = 2
seconds = 0
wait_seconds = 600

# Coordinator proposals are approved whole when valid and unchanged in scope.
# Estimates are compared only when their unit matches the repository unit (case, spaces and a plural s are ignored).
# Other units are kept without conversion; checks are required for every deliverable.
[split]
unit = "lines"   # nonblank repository unit; use pages, images, etc. for other deliverables
part_limit = 1500 # 0 disables the size check
corrections = 2   # 0 asks the human at the first invalid proposal

# --- Replacement ------------------------------------------------------------------------------------------------
# A run may end without a `STATUS:` line, or hang. The task is asked again in the same session a few times (twice for a
# run without a status, `hang_strikes` times for a hang, `turn_limit_resumes` times for a turn limit); after that the
# session itself is the trouble, and the task is started in a new session of the same agent with a briefing of what the
# previous sessions did: its prompt, the commits on its branch, the files it left uncommitted, its plan and the messages
# of its team it had not read. `new_sessions` is how many such restarts a task gets: 1 by default, 0 turns them off.
# When the new session goes bad too, the task is given, briefed, to the first agent of `agents` that is not in its team,
# not in a run, and of the same tier (normal for normal, investigator for investigator), in the same worktree
# and on the same branch; `replacements` is how many such takeovers a task gets. `mode`: "auto" (that, then for a
# member the team's lead, then you), "lead" (a member's work to the team's lead at once) or "off" (you at once, as
# before). With no `agents`, mode "auto" gives a member's work to the team's lead. When the agent that took a task over
# goes bad too, or a lead given a member's work does, you are asked once in a questions file: start it once more, or stop.
# `rejections` is the limit of times a team's lead may return the work of an item to its member (a `RETURNED: <item>` line
# of the lead's final message): 5 by default, 0 for no limit. `agent status` shows the count as `returned 3 of 5`.

[replacement]
new_sessions = 1
replacements = 1
mode = "auto"
# The agents that may take a task over when its runs are beyond the ladder, in the order to try them.
# A refused-provider takeover
# also tries them, skipping a name of the task's team, a busy one, a refused one, or one of the refused
# provider. When the list is empty or no agent fits, the tier `normal` is tried (for a coordinator, the
# investigators); a member's task never goes to a worker, and a coordinator's to an investigator.
agents = []
rejections = 5
# A provider that refuses a run (rate limit, overload or exhausted quota) is waited out: the task is tried again in the same session after the pause, `limit_retries` times (0 to 10, default 1). When the retries are used up, or a quota's reset is further away than `limit_wait_minutes` (default 60; 0 never waits for a reset), the rule answers "change agent"; the pick of the new agent is a pure function in agent-core (from `agents` and then the tier `normal`, of another provider, not in the team, not busy and not refused). A refused agent gets no new task, review or takeover until its return time.
limit_retries = 1
limit_wait_minutes = 60
# A queued task waits this many seconds for its busy agent (one that runs another task at its limit of runs, see
# [limits] runs_per_agent) before a free agent of `agents` of the same tier (normal for normal, investigator for
# investigator) takes it over. 0 never does.
busy_after = 300

# --- Git and GitHub ----------------------------------------------------------------------------------------------
# The identity of every commit an agent makes; {agent} is the agent's name. `signing_key` is an SSH private key that
# signs the commits ("Verified" on GitHub); without it commits are unsigned, even if your own git signs everything.

[git]
name = "{agent} (team-agents)"
email = "{agent}@team-agents.invalid"
# signing_key = "/home/you/.ssh/agents_signing"

# Text on GitHub is data, not instructions, unless these accounts wrote it. Put the human's and the agents'
# own account here; the agents' token is in secrets.toml.

[github]
trusted_accounts = ["your-github-login", "your-agents-github-login"]
# The GitHub API is the public one. A GitHub Enterprise installation has its own address:
# api_base = "https://github.example.com/api/v3"

# --- Notifications -------------------------------------------------------------------------------------------------
# `command` is run with the path of a notification file as its last argument: the first line is the title, the rest
# the body. Without it notifications are only files, in `directory` (default: notifications/ in $AGENTS_HOME).

[notifications]
# command = ["/home/you/bin/notify-ntfy"]
# directory = "/home/you/agents/notifications"

# --- Questions -----------------------------------------------------------------------------------------------------
# An agent that needs you writes a questions file and you are notified. `open = "vscode"` also opens the file in the
# VS Code window connected to this host (Remote-SSH), if there is one; `vscode_server_dirs` are the server directories
# searched for its remote command (default: .vscode-server, .vscode-server-insiders and .cursor-server in the home
# directory of the user the daemon runs as). `editor` is what `agent answer` starts: a program and its arguments, the
# file is its last argument (default: $VISUAL, then $EDITOR).

[questions]
open = "off"
# vscode_server_dirs = ["/home/you/.vscode-server"]
# editor = ["nano"]

# --- History -------------------------------------------------------------------------------------------------------
# The daemon records what happens — every team and round, every prompt, every step and change of every run — in
# `history.db` in $AGENTS_HOME (docs/history.md). `max_text_bytes` is the longest text one field keeps: a longer one is
# cut at a character boundary and marked cut. A history that cannot be written never stops the work; `agent status`
# shows how many records were lost.

[history]
enabled = true
max_text_bytes = 1048576
# Closed rounds and their gate output; 0 keeps everything. Open rounds always stay.
keep_days = 0

# --- Daemon log ----------------------------------------------------------------------------------------------------
# The daemon's own log goes to its standard error (the systemd journal) and to `history.db` (docs/log.md).
# `level` is error | warn | info (default) | debug.

[log]
level = "info"
# Rows belonging to no round; scoped rows follow history.keep_days.
keep_days = 0

# --- Disk space ----------------------------------------------------------------------------------------------------
# Thresholds for filesystem free space in AGENTS_HOME.
#   low_free_gb   below this, a notification is sent once and `agent status` displays free space (default: 100)
#   min_free_gb   below this, `agent run` is refused and open rounds wait for disk space (default: 20)

[disk]
low_free_gb = 100
min_free_gb = 20

# --- Snapshots -----------------------------------------------------------------------------------------------------
# A snapshot keeps everything in a worktree (uncommitted files included) when a run was cut; it is never refused.
#   warn_mb   a snapshot bigger than this is taken and logged with a warning that says its size (default: 200)

[snapshot]
warn_mb = 200

# --- A restart of the daemon ---------------------------------------------------------------------------------------
# A run that was going when the daemon stopped (or crashed) was cut from outside. `session` says where the same agent goes on:
#   "new"    a new session, whose first prompt is a briefing of what the cut run left: its commits, the files it left
#            uncommitted, its plan, who worked on the task before and your answers; no retry of the task is counted for it
#   "same"   the session the run was cut in, resumed with a note that the harness restarted (how it was before 0.77.0)
# A reviewer, a worker, a task whose round is closed and a task that is not queued always resume as before.
#   session   "new" or "same" (default: "new")

[restart]
session = "new"

# --- Session -------------------------------------------------------------------------------------------------------
# The context of a session grows with every run that resumes it. `agent debug` names a session above its bound. The
# default bound was taken from the measurements of 22.11.2026 (sessions that grew to 438 000 and 580 000 tokens), not from
# any model's documentation.
#   max_context   the bound in tokens of a session's context for an agent without its own max_context; a session above it is not resumed, 0 switches it off (default: 150000)

[session]
max_context = 150000

# --- Reminder to commit ---------------------------------------------------------------------------------------------
# A run that holds many uncommitted lines and has made no commit for a while is told once, on the bus, to commit what is
# finished. Both bounds must be reached; a commit re-arms the reminder. Only a solo agent, a coordinator and a member are
# reminded, never a reviewer or a worker. A key at 0 turns the reminder off.
#   lines     uncommitted lines (added plus removed) at which a run is reminded (default: 300)
#   minutes   minutes since the later of the run's last commit and its start at which a run is reminded (default: 30)
# A run that ignores the reminder - no commit, in `cut_after` minutes - is stopped, unless a gate (`agent gate`) or a test
# run of its worktree is going. Its session is then resumed at once, in the same session, with the order to commit first;
# nothing counts against the task: no retry, no turn, no rejection and no replacement. 0 turns the cut off.
#   cut_after   minutes after the reminder at which a run that has not committed is cut (default: 20)
# A session whose context reaches a share of its bound (`[session] max_context`, or the agent's own) is told once, on the
# bus, to commit and to write down where it is, before the next run may start a new session. Codex tells no context, and
# a session with no bound is never reminded.
#   context_percent   percent of the bound at which a session is reminded, 0 to 100 (default: 80)

[commit_reminder]
lines = 300
minutes = 30
cut_after = 20
context_percent = 80

# Limits for repository findings in run messages (selection support; daemon wiring follows separately).
[findings]
keep_days = 30                   # 0–365 days; 0 disables selection
max_shown = 8                    # 1–20 findings per message
max_chars = 3000                 # 500–10000 characters across their texts

# --- Merges --------------------------------------------------------------------------------------------------------
# GitHub may refuse to merge an approved pull request because it conflicts with its base. The lead of the round is then
# asked to merge the base into its branch, at most `conflict_passes` times per round; an investigator then helps once before you are asked.
#   conflict_passes   ordinary lead passes per round on a merge conflict (default: 3); 0 tells you at once regardless of investigator_pass
#   investigator_pass   ask an investigator after those passes, then give the lead one extra pass (default: true)

[merge]
conflict_passes = 3
investigator_pass = true

# --- Publication ---------------------------------------------------------------------------------------------------
# What the harness does when a branch cannot be published to GitHub (push failure, pull request creation or update error).
#   tries   how many times publication is tried before the lead is told once, and after that you are asked (default: 3)

[publish]
tries = 3

# --- Dashboard -----------------------------------------------------------------------------------------------------
# It listens on a loopback address only; remote access goes through `tailscale serve`, and only the Tailscale
# logins listed here get in.

[web]
listen = "127.0.0.1:8787"
allowed_logins = ["you@example.com"]

# --- Repositories --------------------------------------------------------------------------------------------------
# One table per repository, named as GitHub names it. `gate` is the command (a program and its arguments, never a
# shell line) that must pass before a pull request is opened, run in the worktree, for at most `gate_timeout_minutes`.

[repos.team-agents]
base_branch = "main"
gate = ["make", "gate"]
gate_timeout_minutes = 30

# The checks before a review look at the round's own diff, with no model. They know no repository: these lists are all
# they have. A pattern is a glob over paths relative to the repository's root: `*` and `?` within a name, `**` for
# any number of directories, `dir/` for everything below a directory, and a pattern without a `/` for a file name at
# any depth. A repository without this table goes straight to review.
#   test_paths       the test files: a round may add lines to them; changing, removing or renaming one needs your word
#   code_paths       the production code: a round that changes it has to add lines to a test file
#   protected_paths  what judges a round (the gate's scripts, lint and CI configuration, the rules): changing one needs
#                    your word
#   commit_guard     true (the default): the git of every agent's run refuses, while it can still be undone, a commit that
#                    takes lines out of a test a RED: commit froze unless it is a TEST-FIX: commit of test files only;
#                    false: every commit is made and only the checks before a review look at it

[repos.team-agents.checks]
test_paths = ["**/tests/", "**/tests.rs", "*_test.go", "*.bats"]
code_paths = ["bin/", "agentbus/", "live/", "crates/", "tools/"]
commit_guard = true
protected_paths = [".github/", "AGENTS.md", "CLAUDE.md", "GEMINI.md", "Makefile", "tools/gate.sh", "tools/test-lock.sh", "Cargo.toml", "clippy.toml", "rustfmt.toml", "rust-toolchain.toml"]
