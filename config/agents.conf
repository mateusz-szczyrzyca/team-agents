# ~/agents/agents.conf — agent configuration (a bash file sourced by `agent`)

# --- Agents ----------------------------------------------------------------------
# Agent name -> CLI type: claude | codex | gemini (Antigravity CLI `agy`)
#                       | opencode (any API provider: OpenRouter, DeepInfra, ... — pay per token)
# One agent runs one task at a time; add more entries for more parallel work (e.g. [claude-2]=claude).
declare -A AGENT_TYPE=(
  [claude-1]=claude
  [codex-1]=codex
  [gemini-1]=gemini
  # [openrouter-qwen]=opencode
  # [deepinfra-glm]=opencode
)

# Agent tiers:
#  NORMAL_AGENTS — "normal" models: a team elects its coordinator only among them.
#  WORKER_AGENTS — "workers": cheap models for simple, mechanical tasks. They never coordinate; they take
#                  easy items from the team board and `delegate` requests from normal models.
#                  The list order matters: a delegate request goes to the first free worker of the least
#                  busy provider, so put stronger workers first.
#  An agent in neither list counts as normal.
NORMAL_AGENTS=(claude-1 codex-1 gemini-1)
WORKER_AGENTS=(
  # deepinfra-glm
  # openrouter-qwen
)

# Model per agent (empty = the CLI's default model).
#   claude:   sonnet, haiku, opus or a full model ID
#   codex:    an OpenAI model name supported by your Codex CLI
#   gemini:   see `agy models`
#   opencode: "provider/model" — OpenRouter: a preset "openrouter/@preset/<slug>" (routing is configured
#             in the OpenRouter dashboard) or a model "openrouter/<vendor>/<model>";
#             DeepInfra: "deepinfra/<model name as shown on deepinfra.com>"
declare -A AGENT_MODEL=(
  [claude-1]="sonnet"
  [codex-1]=""
  [gemini-1]=""
  # [openrouter-qwen]="openrouter/@preset/qwen-worker"
  # [deepinfra-glm]="deepinfra/zai-org/GLM-5.3-Flash"
)

# Extra CLI arguments per agent (split on spaces).
declare -A AGENT_EXTRA_ARGS=(
  # [codex-1]='-c model_reasoning_effort="medium"'
)

# --- Investigators (advanced, expensive models) ---------------------------------------
# One or more investigators (different models are fine). Shared queue: as many requests in progress as there
# are investigators, plus INVESTIGATION_QUEUE_MAX waiting; a request goes to the first free investigator.
# An investigator waiting for your answers blocks only itself.
declare -A INVESTIGATORS_TYPE=(
  [inv-opus]=claude
  # [inv-codex]=codex
)
declare -A INVESTIGATORS_MODEL=(
  [inv-opus]="opus"
  # [inv-codex]=""
)
declare -A INVESTIGATORS_EXTRA_ARGS=(
  # [inv-codex]='-c model_reasoning_effort="high"'
)
# (The legacy single-investigator format — INVESTIGATOR_TYPE/_MODEL/_EXTRA_ARGS/_NAME — still works
#  when INVESTIGATORS_TYPE is empty.)
INVESTIGATION_QUEUE_MAX=3                 # waiting requests (+ one in progress per investigator)

# --- Hang watchdog -------------------------------------------------------------------
# This many minutes without any agent activity = a hang (the run is killed). Normal models, coordinators and
# investigators are resumed; after AGENT_HANG_STRIKES consecutive hangs without progress the agent is marked
# hung. Workers are not resumed — the normal models are told instead.
AGENT_HANG_MIN=30
AGENT_HANG_STRIKES=3

# --- Language and environment ---------------------------------------------------------
AGENT_LANGUAGE="English"                  # language of questions and notifications (what only you read), e.g. "Polish"
REPO_LANGUAGE="English"                   # language of commits, PRs, reviews, reports and code comments

# --- Commit identity ----------------------------------------------------------------------
# The runner sets the author and committer of every commit an agent makes (see README, "Commit identity").
GIT_NAME_FORMAT="%a (team-agents)"        # %a = agent name → "claude-1 (team-agents)"
GIT_EMAIL=""                              # e.g. the noreply address of the agents' GitHub account; empty = git config
GIT_SIGNING_KEY=""                        # SSH private key that signs commits ("Verified" on GitHub); empty = unsigned
ENV_NOTES_FILE="$HOME/agents/hardware.md" # environment notes for the agents (shared resources, test hosts)

# --- Paths -----------------------------------------------------------------------------
CLAUDE_BIN="$HOME/.local/bin/claude"
CODEX_BIN="$HOME/.local/bin/codex"        # check: command -v codex
AGY_BIN="$HOME/.local/bin/agy"
OPENCODE_BIN="$HOME/.local/bin/opencode"  # check: command -v opencode
OPENCODE_BASH_TIMEOUT_MS=600000           # limit for a single shell command in opencode (10 min)
AGENTBUS_BIN="$HOME/.local/bin/agentbus"

# PATH visible to the agents (toolchains: cargo, go, probe-rs, ansible venvs, ...).
RUN_PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/go/bin:/usr/local/bin:/usr/bin:/bin"

# --- Notifications ---------------------------------------------------------------------
# NOTIFY_CMD is called with the path of a notification file: first line = title/thread, the rest = body.
# Examples are in examples/notify/ (ntfy, Pushsafer). Empty = files are only written to NOTIFY_DIR.
NOTIFY_CMD=""
NOTIFY_DIR="$HOME/agents/notifications"
NOTIFY_MAX_CHARS=1500                     # max length of the agent's final message in a notification

# --- agent live / agent authenticated --------------------------------------------------
LIVE_REMIND_MIN=1                         # remind every N minutes who is still working (override: --remind)
AGENTLIVE_BIN="$HOME/.local/bin/agentlive"
# Models for the test request of `agent authenticated` (cheapest; empty = the CLI's default)
AUTH_MODEL_ANTHROPIC="haiku"
AUTH_MODEL_OPENAI=""
AUTH_MODEL_GEMINI=""
AUTH_MODEL_OPENROUTER=""                  # empty = model of the first openrouter/... agent; no agents: key check only
AUTH_MODEL_DEEPINFRA=""                   # empty = model of the first deepinfra/... agent

# --- Misc ------------------------------------------------------------------------------
BRANCH_PREFIX="agents"                    # branches: agents/<agent>/<date-time>
CLAUDE_MAX_TURNS=300                      # safety limit for Claude Code in -p mode
AGY_PRINT_TIMEOUT="8h"                    # agy -p has a 5 min default limit
