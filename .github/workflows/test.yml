name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats jq p7zip-full
      - name: Lint
        run: make lint
      - name: Go unit tests
        run: make unit-go
      - name: Script tests (bats, stub CLIs)
        run: make unit-bats
